<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="600" viewBox="0 0 1200 600" fill="#f2f5ff" role="img" aria-labelledby="stack-title stack-desc">
<title id="stack-title">Selected technology stack</title>
<desc id="stack-desc">Grouped programming languages, application frameworks, AI and vision tools, data stores, and delivery platforms used across Abdul Sameer&#x27;s projects.</desc>
<defs>
<linearGradient id="stack-field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#0d1b36"/></linearGradient>
<linearGradient id="stack-light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff" stop-opacity="0"/><stop offset=".5" stop-color="#8bc6ff" stop-opacity=".24"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></linearGradient>
</defs>
<style><![CDATA[
 text { font-family: Arial, Helvetica, sans-serif; }
.display { font-family: Impact, 'Arial Black', Arial, sans-serif; font-weight: 900; letter-spacing: -2px; }
.mono { font-family: 'Courier New', monospace; letter-spacing: 1px; }
.kicker { fill: #99b1db; font: 700 13px 'Courier New', monospace; letter-spacing: 1.4px; }
.motion { pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .motion { display: none !important; animation: none !important; } }

@keyframes stack-light { 0%, 20% { transform: translateX(-360px); opacity: 0; } 35% { opacity: 1; } 75% { opacity: .8; } 100% { transform: translateX(1080px); opacity: 0; } }
.stack-light { animation: stack-light 15s cubic-bezier(.2,.7,.2,1) infinite; }
]]></style>
