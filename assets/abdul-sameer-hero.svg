<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Abdul Sameer — AI and full-stack developer</title>
  <desc id="desc">A royal blue technical canvas with a subtle grid, orbital lines, and an animated light sweep.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset=".55" stop-color="#0B1D39"/><stop offset="1" stop-color="#102B55"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#4B8DFF" stop-opacity="0"/><stop offset=".48" stop-color="#78B7FF" stop-opacity=".85"/><stop offset="1" stop-color="#4B8DFF" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8EBBFF" stroke-opacity=".08" stroke-width="1"/></pattern>
    <radialGradient id="halo"><stop stop-color="#2563EB" stop-opacity=".3"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <ellipse cx="920" cy="170" rx="330" ry="230" fill="url(#halo)"/>
  <g fill="none" stroke="#7DB6FF" stroke-opacity=".2"><ellipse cx="970" cy="180" rx="250" ry="95" transform="rotate(-20 970 180)"/><ellipse cx="970" cy="180" rx="205" ry="132" transform="rotate(28 970 180)"/><circle cx="970" cy="180" r="5" fill="#8AC4FF" stroke="none"/></g>
  <path d="M52 282H1148" stroke="#7AB4FF" stroke-opacity=".3"/>
  <path d="M52 282H1148" stroke="url(#glow)" stroke-width="2"><animate attributeName="opacity" values=".25;1;.25" dur="4s" repeatCount="indefinite"/></path>
  <text x="76" y="152" fill="#F5F8FF" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="1">ABDUL SAMEER</text>
  <text x="79" y="196" fill="#AFCBFF" font-family="Segoe UI,Arial,sans-serif" font-size="21" letter-spacing="2">AI / ML  ·  FULL-STACK DEVELOPMENT  ·  RESEARCH</text>
  <text x="80" y="242" fill="#D4E3FF" font-family="Segoe UI,Arial,sans-serif" font-size="16">Building practical systems at the intersection of intelligence and software.</text>
  <circle cx="1088" cy="74" r="3" fill="#A7D2FF"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1122" cy="104" r="2" fill="#5E9EFF"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#9BC5FF" stroke-opacity=".23"/>
</svg>
