<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="ASheroTitle ASheroDesc">
  <title id="ASheroTitle">Abdul Sameer — AI and full-stack developer</title>
  <desc id="ASheroDesc">A royal-blue brutalist identity banner. A four-stage line diagram connects vision, language, retrieval, and product systems.</desc>
  <defs>
    <pattern id="ASheroGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#F4F2EA" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="ASheroSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F2EA" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F4F2EA" stop-opacity=".92"/>
      <stop offset="1" stop-color="#F4F2EA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" fill="#080B12"/>
  <rect x="0" y="0" width="1200" height="16" fill="#1C4EFF"/>
  <rect x="0" y="16" width="1200" height="414" fill="url(#ASheroGrid)"/>
  <path d="M0 74H1200" stroke="#F4F2EA" stroke-opacity=".22"/>
  <text x="48" y="54" fill="#F4F2EA" font-family="Consolas,Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2">ABDUL SAMEER / SYSTEMS INDEX</text>
  <rect x="1004" y="32" width="148" height="28" fill="#1C4EFF"/>
  <text x="1078" y="51" text-anchor="middle" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1">BENGALURU, IN</text>

  <rect x="48" y="105" width="12" height="224" fill="#1C4EFF"/>
  <text x="84" y="194" fill="#F4F2EA" font-family="Arial Black,Arial,sans-serif" font-size="90" font-weight="900" letter-spacing="-3">ABDUL</text>
  <text x="82" y="282" fill="#1C4EFF" stroke="#F4F2EA" stroke-width="1.5" paint-order="stroke" font-family="Arial Black,Arial,sans-serif" font-size="88" font-weight="900" letter-spacing="-3">SAMEER</text>
  <path d="M84 303H615" stroke="#1C4EFF" stroke-width="5"/>
  <path d="M84 303H615" stroke="url(#ASheroSweep)" stroke-width="5" stroke-dasharray="130 430">
    <animate attributeName="stroke-dashoffset" values="560;0" dur="5.5s" repeatCount="indefinite"/>
  </path>
  <text x="84" y="345" fill="#F4F2EA" font-family="Consolas,Menlo,monospace" font-size="17" font-weight="700" letter-spacing="2">AI / ML   ·   FULL-STACK   ·   PRODUCT SYSTEMS</text>
  <text x="84" y="382" fill="#AEB7CC" font-family="Arial,Helvetica,sans-serif" font-size="17">I build the pipeline around the model.</text>

  <rect x="704" y="105" width="448" height="264" fill="#1C4EFF"/>
  <path d="M704 105H1152V369H704Z" fill="url(#ASheroGrid)"/>
  <path d="M736 219H1118" stroke="#080B12" stroke-width="7"/>
  <path d="M736 219H1118" stroke="#F4F2EA" stroke-width="3" stroke-dasharray="18 12">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <g fill="#F4F2EA" stroke="#080B12" stroke-width="5">
    <rect x="752" y="194" width="50" height="50"/>
    <rect x="854" y="194" width="50" height="50"/>
    <rect x="956" y="194" width="50" height="50"/>
    <rect x="1058" y="194" width="50" height="50"/>
  </g>
  <g fill="#080B12" font-family="Consolas,Menlo,monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".4">
    <text x="777" y="273">VISION</text>
    <text x="879" y="273">LANGUAGE</text>
    <text x="981" y="273">RETRIEVAL</text>
    <text x="1083" y="273">PRODUCT</text>
  </g>
  <text x="736" y="148" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="700" letter-spacing="2">INPUT  →  INTELLIGENCE  →  USE</text>
  <text x="736" y="337" fill="#FFFFFF" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="1">COMPUTER VISION / NLP / APPLIED AI</text>
  <rect x="1128" y="121" width="10" height="10" fill="#F4F2EA">
    <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <path d="M48 402H1152" stroke="#F4F2EA" stroke-opacity=".28"/>
  <text x="48" y="420" fill="#AEB7CC" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="1">RESEARCH  /  BUILD  /  ITERATE</text>
  <text x="1152" y="420" text-anchor="end" fill="#AEB7CC" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="1">01 — 04</text>
</svg>
