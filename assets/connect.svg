<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="500" viewBox="0 0 1200 500" fill="#f2f5ff" role="img" aria-labelledby="connect-title connect-desc">
<title id="connect-title">Connect with Abdul Sameer</title>
<desc id="connect-desc">Contact panel for LinkedIn, portfolio, GitHub, and email, with a slow moving signal line and a static reduced-motion fallback.</desc>
<defs>
<linearGradient id="connect-field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1323"/><stop offset="1" stop-color="#10244c"/></linearGradient>
<linearGradient id="connect-signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff" stop-opacity="0"/><stop offset=".5" stop-color="#8bc6ff"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></linearGradient>
</defs>
<style><![CDATA[
 text { font-family: Arial, Helvetica, sans-serif; }
.display { font-family: Impact, 'Arial Black', Arial, sans-serif; font-weight: 900; letter-spacing: -2px; }
.mono { font-family: 'Courier New', monospace; letter-spacing: 1px; }
.kicker { fill: #99b1db; font: 700 13px 'Courier New', monospace; letter-spacing: 1.4px; }
.motion { pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .motion { display: none !important; animation: none !important; } }

@keyframes connect-signal { 0%, 25% { transform: translateX(-420px); opacity: 0; } 38% { opacity: 1; } 82% { opacity: 1; } 100% { transform: translateX(860px); opacity: 0; } }
.connect-signal { animation: connect-signal 14s ease-in-out infinite; }
]]></style>

<rect width="1200" height="500" fill="url(#connect-field)"/>
<path d="M0 0H1200V8H0Z" fill="#247bff"/>
<text x="55" y="62" class="kicker">04  /  OPEN CHANNEL</text><text x="1145" y="62" text-anchor="end" class="kicker">CONNECT  ·  COLLABORATE  ·  BUILD</text>
<text x="58" y="213" class="display" font-size="81" fill="#f2f5ff">LET'S BUILD</text>
<text x="58" y="302" class="display" font-size="81" fill="#247bff">WHAT'S NEXT.</text>
<text x="64" y="360" class="mono" font-size="16" fill="#99b1db">AI / ML  ·  FULL-STACK  ·  PRODUCT SYSTEMS</text>
<path d="M58 402H1142" stroke="#26364d" stroke-width="2"/>
<path d="M58 402H1142" stroke="#247bff" stroke-width="3" stroke-dasharray="110 950" class="motion connect-signal"/>
<text x="58" y="449" class="kicker">LINKEDIN</text><text x="330" y="449" class="kicker">PORTFOLIO</text><text x="635" y="449" class="kicker">GITHUB</text><text x="905" y="449" class="kicker">EMAIL</text>
<path d="M58 470H1142" stroke="#26364d"/>
<text x="58" y="488" class="mono" font-size="11" fill="#99b1db">BENGALURU, INDIA</text><text x="1142" y="488" text-anchor="end" class="mono" font-size="11" fill="#99b1db">ABDUL SAMEER  /  SAMEER8549</text>

</svg>
