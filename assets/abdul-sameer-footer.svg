<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="ASfootTitle ASfootDesc">
  <title id="ASfootTitle">Build the system. Keep learning.</title>
  <desc id="ASfootDesc">A minimal royal-blue closing strip with an animated signal moving through a modular line.</desc>
  <rect width="1200" height="112" fill="#080B12"/>
  <rect width="1200" height="8" fill="#1C4EFF"/>
