name: Render contribution snapshot animation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_activity.py"
      - ".github/workflows/update-activity.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow==10.4.0
      - run: python scripts/generate_activity.py
      - name: Commit refreshed animation if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/activity.gif
          git diff --cached --quiet || git commit -m "Render animated contribution profile snapshot [skip ci]"
          git push
